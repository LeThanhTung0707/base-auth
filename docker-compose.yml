services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_MULTIPLE_DATABASES: backend_db,booking_db,address_db,notification_db,food_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/backend_db
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      PORT: 4000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ACCESS_TTL_MIN: 15
      REFRESH_TTL_DAYS: 14
      CSRF_TTL_DAYS: 14
    depends_on:
      - postgres
      - redis

  booking:
    build:
      context: .
      dockerfile: booking/Dockerfile
    restart: always
    ports:
      - "4001:4001"
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/booking_db
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      PORT: 4001
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    depends_on:
      - postgres
      - redis

  address:
    build:
      context: .
      dockerfile: address/Dockerfile
    restart: always
    ports:
      - "4002:4002"
    command: sh -c "npx prisma migrate deploy && node dist/src/main.js"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/address_db
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      PORT: 4002
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - backend
    extra_hosts:
      - "localhost:host-gateway"

  food:
    build:
      context: .
      dockerfile: food/Dockerfile
    restart: always
    ports:
      - "4004:4004"
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/food_db
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      PORT: 4004
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    depends_on:
      - postgres
      - redis

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      BACKEND_SERVICE_URL: http://backend:4000
      BOOKING_SERVICE_URL: http://booking:4001
      ADDRESS_SERVICE_URL: http://address:4002
      FOOD_SERVICE_URL: http://food:4004
    depends_on:
      - backend
      - booking
      - address
      - food

volumes:
  postgres_data:
  redis_data:
